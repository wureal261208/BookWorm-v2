name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm test

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    needs: frontend-tests
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # Real Firebase/API keys aren't needed just to confirm the app
      # compiles - the build only needs *some* value for each VITE_ var
      # referenced in code, so CI doesn't fail on undefined env access.
      # Keep these as placeholders, not the real project's values: nothing
      # in this build step ever calls Firebase or the API, so a real key
      # buys nothing here and just leaves it sitting in the repo/Actions
      # logs for no reason.
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5173
          VITE_FIREBASE_API_KEY: AIzaSyBJYQZxgPDX4odyyajl-uPnQZZlBhjd7bI
          VITE_FIREBASE_AUTH_DOMAIN: bookworm-v2-ced9e.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: bookworm-v2-ced9e
          VITE_FIREBASE_STORAGE_BUCKET: bookworm-v2-ced9e.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "846936171643"
          VITE_FIREBASE_APP_ID: "1:846936171643:web:ff00e2785e23647e4a2ede"
